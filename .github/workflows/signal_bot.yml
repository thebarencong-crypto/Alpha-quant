
name: ALPHAQUANT V7 Book Technical Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: alphaquant-v7-main
  cancel-in-progress: false

jobs:
  signal-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        run: |
          python -m unittest -q \
            test_signal_bot_book.py \
            test_signal_bot_regression.py

      - name: Run signal bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

          RUN_FOREVER: '0'
          GITHUB_CANDLE_RESCUE: '1'
          GITHUB_PRE_CLOSE_WAIT_SEC: '75'
          GITHUB_POST_CLOSE_POLL_SEC: '40'

          SIGNAL_HISTORY_FILE: signals_history.json

          BOOK_MIN_RR: '2.0'
          BOOK_MIN_SCORE: '57'
          BOOK_HTF: '1H'

        run: python signal_bot.py

      - name: Save signals history
        if: always()
        run: |
          if [ ! -f signals_history.json ]; then
            echo 'No history file.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- signals_history.json

          if git diff --cached --quiet; then
            echo 'History unchanged.'
          else
            git commit -m 'chore: update ALPHAQUANT history [skip ci]'
            git push
          fi

