name: ALPHAQUANT V7.1 Book Technical Scan

on:
  workflow_dispatch:
  schedule:
    # Best effort: minute 02, 07, 12, 17, ... 57 (UTC)
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: alphaquant-v7-main
  cancel-in-progress: false

jobs:
  signal-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile signal_bot.py

      - name: Run available offline tests
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for test_file in test_signal_bot_book.py test_signal_bot_regression.py test_timing_v7_1.py; do
            if [[ -f "$test_file" ]]; then
              tests+=("$test_file")
            else
              echo "::warning file=$test_file::File pengujian belum ada di repository; upload untuk mengaktifkan tes lengkap."
            fi
          done

          if (( ${#tests[@]} > 0 )); then
            printf 'Running %s offline test module(s): %s\n' "${#tests[@]}" "${tests[*]}"
            python -m unittest -q "${tests[@]}"
          else
            echo '::warning::Tidak ada file offline test. Pemeriksaan sintaks berhasil, tetapi tes perilaku bot TIDAK dijalankan.'
          fi

      - name: Run signal bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_FOREVER: '0'
          GITHUB_CANDLE_RESCUE: '1'
          GITHUB_PRE_CLOSE_WAIT_SEC: '75'
          GITHUB_POST_CLOSE_POLL_SEC: '40'
          SIGNAL_HISTORY_FILE: signals_history.json
          BOOK_MIN_RR: '2.0'
          BOOK_MIN_SCORE: '57'
          BOOK_HTF: '1H'
        run: python signal_bot.py

      - name: Persist signal history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f signals_history.json ]]; then
            echo 'No history file to persist.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- signals_history.json
          if git diff --cached --quiet; then
            echo 'History unchanged.'
          else
            git commit -m 'chore: update ALPHAQUANT history [skip ci]'
            git push
          fi
